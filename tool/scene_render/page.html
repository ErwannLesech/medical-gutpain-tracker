<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script type="importmap">
{ "imports": {
  "three": "/tool/scene_render/node_modules/three/build/three.module.js",
  "three/addons/": "/tool/scene_render/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body style="margin:0;background:transparent">
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

// ---------------------------------------------------------------------------
// Caméra isométrique fixe : toutes les images partagent le même angle.
// ---------------------------------------------------------------------------
const AZIMUTH = THREE.MathUtils.degToRad(45);   // vue depuis l'avant-droite
const ELEVATION = THREE.MathUtils.degToRad(32); // légère plongée
const VIEW_DIR = new THREE.Vector3(
  Math.cos(ELEVATION) * Math.sin(AZIMUTH),
  Math.sin(ELEVATION),
  Math.cos(ELEVATION) * Math.cos(AZIMUTH),
).normalize();

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x000000, 0);

const loader = new GLTFLoader();
const cache = new Map();
async function loadModel(url) {
  if (!cache.has(url)) cache.set(url, loader.loadAsync(url).then((g) => g.scene));
  const src = await cache.get(url);
  // SkeletonUtils : les personnages ont un squelette qu'un clone simple partagerait
  const obj = SkeletonUtils.clone(src);
  obj.traverse((o) => {
    if (o.isMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
      // Feuillages en transparence : découpe nette, et ombre qui suit la découpe
      for (const m of [].concat(o.material)) {
        if (m.map && (m.transparent || m.alphaTest > 0)) {
          m.alphaTest = Math.max(m.alphaTest, 0.5);
          m.transparent = false;
        }
      }
    }
  });
  return obj;
}

function makeLights(scene, center, radius) {
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8d7d6a, 1.55));
  const sun = new THREE.DirectionalLight(0xfff4e0, 2.1);
  sun.position.copy(center).add(new THREE.Vector3(-0.55, 1.35, 0.8).normalize().multiplyScalar(radius * 3 + 10));
  sun.target.position.copy(center);
  sun.castShadow = true;
  sun.shadow.mapSize.set(4096, 4096);
  const s = radius * 1.6 + 2;
  Object.assign(sun.shadow.camera, { left: -s, right: s, top: s, bottom: -s, near: 0.1, far: radius * 8 + 40 });
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.02;
  sun.shadow.radius = 4;
  scene.add(sun, sun.target);
  const fill = new THREE.DirectionalLight(0xdfe8ff, 0.55);
  fill.position.copy(VIEW_DIR).multiplyScalar(50);
  scene.add(fill);
}

/** Caméra orthographique centrée sur `center`, `ppu` pixels par unité. */
function makeCamera(center, width, height, ppu) {
  const cam = new THREE.OrthographicCamera(-width / 2 / ppu, width / 2 / ppu, height / 2 / ppu, -height / 2 / ppu, 0.1, 500);
  cam.position.copy(center).add(VIEW_DIR.clone().multiplyScalar(200));
  cam.lookAt(center);
  cam.updateMatrixWorld();
  cam.updateProjectionMatrix();
  return cam;
}

function project(cam, p, width, height) {
  const v = p.clone().project(cam);
  return { x: (v.x + 1) / 2 * width, y: (1 - v.y) / 2 * height };
}

/** Rend la scène, puis découpe le cadre utile (pixels non transparents). */
function renderCropped(scene, cam, width, height, format = 'image/webp') {
  renderer.setSize(width, height, false);
  renderer.render(scene, cam);
  const c2 = document.createElement('canvas');
  c2.width = width; c2.height = height;
  const ctx = c2.getContext('2d');
  ctx.drawImage(renderer.domElement, 0, 0);
  const data = ctx.getImageData(0, 0, width, height).data;
  let minX = width, minY = height, maxX = -1, maxY = -1;
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      if (data[(y * width + x) * 4 + 3] > 6) {
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return null;
  minX = Math.max(0, minX - 1); minY = Math.max(0, minY - 1);
  maxX = Math.min(width - 1, maxX + 1); maxY = Math.min(height - 1, maxY + 1);
  const w = maxX - minX + 1, h = maxY - minY + 1;
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  out.getContext('2d').drawImage(c2, minX, minY, w, h, 0, 0, w, h);
  return { x: minX, y: minY, w, h, data: out.toDataURL(format, 0.92), canvas: out };
}

function placeObject(obj, piece) {
  obj.position.set(...piece.pos);
  obj.rotation.y = THREE.MathUtils.degToRad(piece.rot || 0);
  if (piece.scale) obj.scale.setScalar(piece.scale);
  obj.updateMatrixWorld(true);
}

/** Ombre portée au sol, sous une pièce, sur un plan transparent. */
function shadowCatcher(y, box, opacity = 0.22) {
  const size = box.getSize(new THREE.Vector3());
  const c = box.getCenter(new THREE.Vector3());
  const g = new THREE.PlaneGeometry(size.x * 2.2 + 1.2, size.z * 2.2 + 1.2);
  const m = new THREE.Mesh(g, new THREE.ShadowMaterial({ opacity }));
  m.rotation.x = -Math.PI / 2;
  m.position.set(c.x, y + 0.002, c.z);
  m.receiveShadow = true;
  return m;
}

function makeTerrain(t) {
  const group = new THREE.Group();
  const [w, d] = t.size;
  const depth = t.depth ?? 0.5;
  const dirt = new THREE.Mesh(
    new RoundedBoxGeometry(w, depth, d, 4, Math.min(0.45, depth * 0.9)),
    new THREE.MeshStandardMaterial({ color: t.sideColor ?? 0x9c6b4e, roughness: 1 }),
  );
  dirt.position.set(t.center[0], -depth / 2 - 0.08, t.center[1]);
  const top = new THREE.Mesh(
    new RoundedBoxGeometry(w + 0.02, 0.16, d + 0.02, 4, 0.08),
    new THREE.MeshStandardMaterial({ color: t.topColor ?? 0x7cc46a, roughness: 1 }),
  );
  top.position.set(t.center[0], -0.08, t.center[1]);
  dirt.receiveShadow = top.receiveShadow = true;
  group.add(dirt, top);
  // Île posée sur le plateau (le dessus du plateau sert alors d'eau)
  for (const isl of [].concat(t.island ?? [])) {
    const h = isl.top + 0.1;
    const m = new THREE.Mesh(
      new RoundedBoxGeometry(isl.size[0], h, isl.size[1], 5, Math.min(0.6, isl.size[0] / 4)),
      new THREE.MeshStandardMaterial({ color: isl.color ?? 0xf2c89a, roughness: 1 }),
    );
    m.position.set(isl.center[0], h / 2 - 0.1, isl.center[1]);
    m.receiveShadow = true;
    group.add(m);
  }
  return group;
}

// ---------------------------------------------------------------------------
// API appelée depuis Node
// ---------------------------------------------------------------------------

/** Planche-contact : chaque modèle seul, même échelle, avec son nom. */
window.contactSheet = async (kitUrl, names, cols = 6, cell = 260, ppu = 110) => {
  const sheet = document.createElement('canvas');
  const rows = Math.ceil(names.length / cols);
  sheet.width = cols * cell; sheet.height = rows * (cell + 22);
  const sctx = sheet.getContext('2d');
  sctx.fillStyle = '#3b3b48'; sctx.fillRect(0, 0, sheet.width, sheet.height);
  const info = {};
  for (let i = 0; i < names.length; i++) {
    const scene = new THREE.Scene();
    const obj = await loadModel(`${kitUrl}/${names[i]}.glb`);
    scene.add(obj);
    const box = new THREE.Box3().setFromObject(obj);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    info[names[i]] = { min: box.min.toArray().map((v) => +v.toFixed(3)), max: box.max.toArray().map((v) => +v.toFixed(3)), size: size.toArray().map((v) => +v.toFixed(3)) };
    makeLights(scene, center, size.length());
    const cam = makeCamera(center, cell, cell, ppu);
    renderer.setSize(cell, cell, false);
    renderer.render(scene, cam);
    const x = (i % cols) * cell, y = Math.floor(i / cols) * (cell + 22);
    sctx.drawImage(renderer.domElement, x, y);
    sctx.fillStyle = '#fff'; sctx.font = '15px sans-serif';
    sctx.fillText(`${names[i]} ${size.x.toFixed(2)}×${size.y.toFixed(2)}×${size.z.toFixed(2)}`, x + 6, y + cell + 16);
  }
  return { png: sheet.toDataURL('image/png'), info };
};

/**
 * Rend une scène complète :
 *  - image de référence (scène finie, vraie 3D)
 *  - terrain seul
 *  - un sprite par pièce (même caméra, découpé), position + ancre
 *  - une icône par modèle (pour le tiroir)
 */
window.renderScene = async (def) => {
  const kit = def.kitUrl;
  const objects = [];
  for (const p of def.pieces) {
    const obj = await loadModel(`${p.kit ?? kit}/${p.model}.glb`);
    placeObject(obj, { ...p, scale: p.scale ?? def.scale });
    objects.push(obj);
  }
  // Boîte englobante de la scène + terrain
  const all = new THREE.Box3();
  objects.forEach((o) => all.expandByObject(o));
  const terrain = def.terrain ? makeTerrain(def.terrain) : null;
  if (terrain) all.expandByObject(terrain);
  const center = all.getCenter(new THREE.Vector3());
  const radius = all.getSize(new THREE.Vector3()).length() / 2;

  // Taille de l'image : on projette les 8 coins de la boîte
  const ppu = def.ppu;
  const probe = makeCamera(center, 1000, 1000, ppu);
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const x of [all.min.x, all.max.x]) for (const y of [all.min.y, all.max.y]) for (const z of [all.min.z, all.max.z]) {
    const p = project(probe, new THREE.Vector3(x, y, z), 1000, 1000);
    minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
  }
  const margin = 24;
  const width = Math.ceil(maxX - minX + margin * 2);
  const height = Math.ceil(maxY - minY + margin * 2);
  // recentre la caméra sur le milieu de l'empreinte projetée
  const shift = new THREE.Vector3(((minX + maxX) / 2 - 500) / ppu, -((minY + maxY) / 2 - 500) / ppu, 0);
  shift.applyQuaternion(probe.quaternion);
  const camCenter = center.clone().add(shift);
  const cam = makeCamera(camCenter, width, height, ppu);

  const result = { width, height, ppu, slots: [], icons: {} };
  if (def.petSpot) {
    const a = project(cam, new THREE.Vector3(...def.petSpot), width, height);
    result.petSpot = { x: +a.x.toFixed(1), y: +a.y.toFixed(1) };
  }

  // 1) Référence : tout ensemble
  {
    const scene = new THREE.Scene();
    if (terrain) scene.add(terrain);
    objects.forEach((o) => scene.add(o));
    makeLights(scene, center, radius);
    const r = renderCropped(scene, cam, width, height);
    result.reference = { x: r.x, y: r.y, w: r.w, h: r.h, data: r.data };
    objects.forEach((o) => scene.remove(o));
    if (terrain) scene.remove(terrain);
  }
  // 2) Terrain seul
  if (terrain) {
    const scene = new THREE.Scene();
    scene.add(terrain);
    makeLights(scene, center, radius);
    const r = renderCropped(scene, cam, width, height);
    result.terrain = { x: r.x, y: r.y, w: r.w, h: r.h, data: r.data };
    scene.remove(terrain);
  }
  // 3) Une image par pièce
  for (let i = 0; i < def.pieces.length; i++) {
    const p = def.pieces[i];
    const obj = objects[i];
    const scene = new THREE.Scene();
    scene.add(obj);
    const box = new THREE.Box3().setFromObject(obj);
    if (p.shadow !== false) scene.add(shadowCatcher(p.pos[1], box));
    makeLights(scene, center, radius);
    const r = renderCropped(scene, cam, width, height);
    const base = new THREE.Vector3((box.min.x + box.max.x) / 2, p.pos[1], (box.min.z + box.max.z) / 2);
    const anchor = project(cam, base, width, height);
    // profondeur : distance à la caméra du centre de la base (plus petit = plus loin)
    const depth = base.clone().sub(camCenter).dot(VIEW_DIR);
    result.slots.push({ id: p.id, x: r.x, y: r.y, w: r.w, h: r.h, ax: +anchor.x.toFixed(1), ay: +anchor.y.toFixed(1), depth: +depth.toFixed(3), top: +box.max.y.toFixed(3), data: r.data });
    scene.remove(obj);
  }
  // 4) Icônes : chaque modèle seul, cadré automatiquement, rotation 0
  const models = [...new Set(def.pieces.map((p) => `${p.kit ?? kit}|${p.model}`))];
  for (const key of models) {
    const [k, model] = key.split('|');
    const obj = await loadModel(`${k}/${model}.glb`);
    const scene = new THREE.Scene();
    scene.add(obj);
    const box = new THREE.Box3().setFromObject(obj);
    const size = box.getSize(new THREE.Vector3());
    const c = box.getCenter(new THREE.Vector3());
    makeLights(scene, c, size.length());
    const S = 256;
    const camI = makeCamera(c, S, S, S / (size.length() * 1.05));
    const r = renderCropped(scene, camI, S, S);
    result.icons[model] = r.data;
  }
  return result;
};

/**
 * Animaux : rendus seuls avec la caméra des scènes (même échelle, même angle),
 * pour être posés sur n'importe quelle scène. Ancre = centre de la base.
 */
window.renderPets = async (kitUrl, names, ppu, scale) => {
  const out = {};
  for (const name of names) {
    const obj = await loadModel(`${kitUrl}/${name}.glb`);
    placeObject(obj, { pos: [0, 0, 0], rot: 30, scale }); // trois-quarts face caméra
    const scene = new THREE.Scene();
    scene.add(obj);
    const box = new THREE.Box3().setFromObject(obj);
    scene.add(shadowCatcher(0, box, 0.25));
    makeLights(scene, new THREE.Vector3(), 3);
    const S = 400;
    const cam = makeCamera(new THREE.Vector3(0, 0.3, 0), S, S, ppu);
    const r = renderCropped(scene, cam, S, S);
    const a = project(cam, new THREE.Vector3((box.min.x + box.max.x) / 2, 0, (box.min.z + box.max.z) / 2), S, S);
    // icône de présentation, plus grande
    const camI = makeCamera(box.getCenter(new THREE.Vector3()), 256, 256, 256 / (box.getSize(new THREE.Vector3()).length() * 1.05));
    scene.children.filter((c) => c.material?.isShadowMaterial).forEach((c) => scene.remove(c));
    const icon = renderCropped(scene, camI, 256, 256);
    out[name] = { w: r.w, h: r.h, ax: +(a.x - r.x).toFixed(1), ay: +(a.y - r.y).toFixed(1), data: r.data, icon: icon.data };
  }
  return out;
};

/** Superpose les sprites dans l'ordre donné et compare à la référence. */
window.compositeCheck = async (width, height, terrain, sprites, reference) => {
  const load = (src) => new Promise((ok) => { const im = new Image(); im.onload = () => ok(im); im.src = src; });
  const c = document.createElement('canvas'); c.width = width; c.height = height;
  const ctx = c.getContext('2d');
  if (terrain) ctx.drawImage(await load(terrain.data), terrain.x, terrain.y);
  for (const s of sprites) ctx.drawImage(await load(s.data), s.x, s.y);
  const ref = document.createElement('canvas'); ref.width = width; ref.height = height;
  const rctx = ref.getContext('2d');
  const refIm = await load(reference.data);
  rctx.drawImage(refIm, reference.x ?? 0, reference.y ?? 0);
  const a = ctx.getImageData(0, 0, width, height).data, b = rctx.getImageData(0, 0, width, height).data;
  let diff = 0, counted = 0;
  for (let i = 0; i < a.length; i += 4) {
    if (a[i + 3] < 10 && b[i + 3] < 10) continue;
    counted++;
    const d = Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]);
    if (d > 90) diff++;
  }
  return { ratio: diff / Math.max(1, counted), png: c.toDataURL('image/png') };
};

window.ready = true;
</script>
</body>
</html>
